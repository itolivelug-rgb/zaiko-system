{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン - 在庫管理システム</title>
    <link rel="stylesheet" href="{% static 'equipment/css/style.css' %}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px;
            width: 340px;
        }
        .login-logo {
            background: var(--bg-header);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .login-logo img { height: 60px; display: block; margin: 0 auto; 
        }
        .login-title {
            text-align: center;
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .login-error {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid var(--danger);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .login-box button { width: 100%; padding: 10px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo">
            <img src="{% static 'equipment/img/logo.png' %}" alt="LIVE LUGGAGE">
        </div>
        <div class="login-title">在庫管理システム</div>

        {% if form.errors %}
        <div class="login-error">ユーザー名またはパスワードが正しくありません。</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="id_username">ユーザー名</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="field">
                <label for="id_password">パスワード</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <button type="submit">ログイン</button>
        </form>
    </div>
</body>
</html>
